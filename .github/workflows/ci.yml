name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13.2'
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements-dev.txt
      - run: PYTHONPATH=src python -m marketmind.api.artifacts
      - run: pip check
      - run: PYTHONPATH=src python -m compileall -q src
      - run: PYTHONPATH=src python -c "from marketmind.api.main import app; assert app"
      - run: PYTHONPATH=src pytest -q
      - run: PYTHONPATH=src python scripts/production_verify.py

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm audit --audit-level=high
      - run: npm test -- --reporter=dot
      - run: npm run typecheck
      - run: npm run build
        env:
          VITE_MARKETMIND_API_BASE_URL: https://api.example.invalid
